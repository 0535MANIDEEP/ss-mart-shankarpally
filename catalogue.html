    <style>
/* =====================================================================
   SS MART catalogue

   Same paper, ink and cobalt as the shop page, and the same two rules:
   panels are square, buttons are pills.

   The one idea here is that this is a RATE LIST, not a shop window.
   There are no product photographs, so nothing pretends to be one: no
   placeholder boxes, no grey rectangles. The type carries the page, and
   the price is set in the mono face so a column of them lines up like a
   printed list.
   ===================================================================== */

/* The [hidden] attribute needs an explicit reset here: a class like display
   or a component rule that sets display would otherwise override the UA
   default of none, and hidden things keep rendering. */
[hidden] {
  display: none !important;
}

.catbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
}
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-height: 3.7rem;
}

.catbar__mark {
  flex: none;
  width: 2.1rem;
  height: 2.1rem;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--paper);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  text-decoration: none;
}

.catbar__brand {
  display: none;
  flex: none;
  text-decoration: none;
  line-height: 1.1;
}

.catbar__name {
  display: block;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.catbar__sub {
  display: block;
  font-size: 0.68rem;
  color: var(--ink-3);
}

@media (min-width: 32rem) {
  .catbar__brand {
    display: block;
  }
}

.search {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 0.45rem;
  border: 1px solid var(--rule-2);
  background: var(--paper);
  padding: 0 0.6rem;
  min-height: 2.45rem;
}

.search:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}

.search__icon {
  width: 1.05rem;
  height: 1.05rem;
  color: var(--ink-3);
}

.search input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 1rem;
  padding: 0.45rem 0;
}

.search input:focus {
  outline: 0;
}

.search input::-webkit-search-cancel-button {
  display: none;
}

.search__clear {
  flex: none;
  display: grid;
  place-items: center;
  width: 1.7rem;
  height: 1.7rem;
  border: 0;
  background: transparent;
  color: var(--ink-3);
  cursor: pointer;
}

.search__clear:hover {
  color: var(--ink);
}

/* ------------------------------------------------------------- the page */

.cat-main {
  padding-block: 1.6rem 5.5rem;
}

#view {
  max-width: 46rem;
  margin-inline: auto;
}

.cat-h1 {
  font-size: clamp(1.7rem, 7vw, 2.35rem);
}

.cat-h1 small {
  display: block;
  margin-top: 0.4rem;
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--ink-3);
  line-height: 1.35;
}

.lede {
  margin-top: 0.75rem;
  max-width: 36rem;
  color: var(--ink-2);
  font-size: 0.97rem;
}

.notice {
  margin-top: 1.2rem;
  padding: 0.7rem 0.85rem;
  border: 1px solid var(--rule);
  background: var(--paper-2);
  font-size: 0.8rem;
  color: var(--ink-2);
}

.notice strong {
  color: var(--ink);
}

.crumb {
  display: inline-block;
  margin-bottom: 0.55rem;
  font-size: 0.8rem;
  color: var(--ink-3);
  text-decoration: none;
}

.crumb::before {
  content: "\2190\00a0";
}

.crumb:hover {
  color: var(--ink);
}

/* --------------------------------------------------------------- tiles */

.tiles {
  margin-top: 1.4rem;
  display: grid;
  grid-template-columns: 1fr;
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}

@media (min-width: 30rem) {
  .tiles {
    grid-template-columns: 1fr 1fr;
    /* Odd category count leaves one empty column behind without this. */
  }
}

.tile {
  min-height: 3.5rem;
  padding: 0.95rem 1.05rem;
  background: var(--paper);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  text-decoration: none;
}

.tile:last-child:nth-child(odd) {
  grid-column: 1 / -1;
}

.tile:hover {
  background: var(--paper-2);
}

.tile__name {
  font-size: 1rem;
  font-weight: 650;
  letter-spacing: -0.012em;
}

.tile__count {
  flex: none;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-3);
}

/* --------------------------------------------------------------- items */

.items {
  list-style: none;
  margin: 1.4rem 0 0;
  padding: 0;
  border-top: 1px solid var(--rule);
}

.item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 5.6rem;
  align-items: center;
  gap: 0.55rem;
  padding: 0.62rem 0;
  border-bottom: 1px solid var(--rule);
}

.item__name {
  font-size: 0.96rem;
  font-weight: 600;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.item__meta {
  margin-top: 0.05rem;
  font-size: 0.73rem;
  color: var(--ink-3);
}

.item__price {
  text-align: right;
  font-family: var(--mono);
  font-size: 0.9rem;
  font-weight: 700;
  white-space: nowrap;
}

.item__mrp {
  display: block;
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 500;
  color: var(--ink-3);
}

.item__act {
  justify-self: end;
  display: flex;
  justify-content: flex-end;
  width: 100%;
}

.add {
  min-height: 2.15rem;
  padding: 0 0.95rem;
  border: 1px solid var(--rule-2);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}

.add:hover {
  border-color: var(--ink);
}

.stepper {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--rule-2);
  border-radius: 999px;
  overflow: hidden;
}

.stepper button {
  width: 1.95rem;
  height: 2.15rem;
  border: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
}

.stepper button:hover {
  background: var(--paper-2);
}

.stepper span {
  min-width: 1.35rem;
  text-align: center;
  font-family: var(--mono);
  font-size: 0.76rem;
  font-weight: 700;
}

.more-wrap {
  margin-top: 1.5rem;
  text-align: center;
}

.more {
  width: 100%;
}

/* ---------------------------------------------------------- empty state */

.empty {
  margin-top: 1.6rem;
  padding: 2rem 1.15rem;
  border: 1px dashed var(--rule-2);
  text-align: center;
  color: var(--ink-2);
  font-size: 0.92rem;
}

.empty__title {
  margin-bottom: 0.35rem;
  color: var(--ink);
  font-weight: 700;
}

.empty .btn {
  margin-top: 1.15rem;
}

/* -------------------------------------------------------------- basket */

.basket {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 40;
  background: var(--ink);
  color: var(--paper);
  padding: 0.6rem 1.25rem calc(0.6rem + env(safe-area-inset-bottom));
}

.basket__row {
  max-width: 46rem;
  margin-inline: auto;
  display: flex;
  align-items: center;
  gap: 1rem;
}

.basket__count {
  font-size: 0.7rem;
  opacity: 0.72;
}

.basket__total {
  font-family: var(--mono);
  font-size: 1.02rem;
  font-weight: 700;
}

.basket__btn {
  margin-left: auto;
  min-height: 2.6rem;
}

.has-basket .cat-main {
  padding-bottom: 7.5rem;
}

/* -------------------------------------------------------------- dialog */

/* A <dialog> is display: none unless open; the UA default, which our flex
   rule would otherwise override, has to win. */
.order:not([open]) {
  display: none;
}

.order {
  display: flex;
  flex-direction: column;
  width: min(34rem, calc(100vw - 1.25rem));
  max-height: calc(100dvh - 1.25rem);
  padding: 0;
  border: 1px solid var(--rule-2);
  background: var(--paper);
  color: var(--ink);
}

.order::backdrop {
  background: rgb(8 8 12 / 0.5);
}

.order__head {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.9rem 1.05rem;
  border-bottom: 1px solid var(--rule);
}

.order__title {
  font-size: 1.15rem;
}

.order__close {
  display: grid;
  place-items: center;
  width: 2.15rem;
  height: 2.15rem;
  border: 1px solid var(--rule-2);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}

.order__body {
  overflow: auto;
  padding: 0 1.05rem 1.15rem;
}

.olines {
  list-style: none;
  margin: 0;
  padding: 0;
}

.oline {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 0.55rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--rule);
}

.oline__name {
  font-size: 0.9rem;
  font-weight: 600;
  line-height: 1.25;
}

.oline__meta {
  font-size: 0.7rem;
  color: var(--ink-3);
}

.oline__sum {
  min-width: 3.4rem;
  text-align: right;
  font-family: var(--mono);
  font-size: 0.8rem;
  font-weight: 700;
}

.ototal {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  padding-top: 0.85rem;
  font-size: 0.95rem;
}

.ototal strong {
  font-family: var(--mono);
  font-size: 1.12rem;
}

.odefee {
  margin: 0.35rem 0 0;
  font-size: 0.78rem;
  color: var(--ink-2);
}

.onote {
  margin: 0.35rem 0 1rem;
  font-size: 0.74rem;
  color: var(--ink-3);
}

.field {
  display: block;
  margin-bottom: 0.85rem;
}

.field > span,
.field legend {
  display: block;
  margin-bottom: 0.3rem;
  font-size: 0.75rem;
  font-weight: 600;
}

.field input,
.field textarea {
  width: 100%;
  padding: 0.5rem 0.6rem;
  border: 1px solid var(--rule-2);
  border-radius: 0;
  background: var(--paper);
  color: var(--ink);
  font: inherit;
  font-size: 1rem;
}

.field input:focus,
.field textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.field--choice {
  margin: 0 0 0.85rem;
  padding: 0;
  border: 0;
}

.radio {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  margin-right: 1.1rem;
  font-size: 0.9rem;
}

.radio input {
  width: auto;
}

.oacts {
  display: flex;
  flex-wrap: wrap;
  gap: 0.55rem;
  margin-top: 0.9rem;
}

.oacts .btn {
  flex: 1 1 10rem;
}

.olink {
  margin-top: 0.8rem;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink-3);
  font: inherit;
  font-size: 0.76rem;
  text-decoration: underline;
  cursor: pointer;
}

.oerr {
  margin-top: 0.35rem;
  color: var(--shut);
  font-size: 0.8rem;
}

/* -------------------------------------------------------------- footer */

.cat-foot {
  margin-top: 1rem;
}

.cat-foot .foot__hours {
  font-size: 0.8rem;
  color: var(--ink-3);
}

.cat-foot .foot__tel {
  font-family: var(--mono);
  font-size: 0.82rem;
  text-decoration: none;
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto;
  }
}

    </style>

    <script>
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('catalogue-data').textContent);
  var CATS = DATA.categories;
  var ITEMS = DATA.items;
  var SETTINGS = DATA.settings;
  var DELIVERY_FEE = Number(SETTINGS.deliveryFee) || 0;

  var byCode = {};
  var index = [];
  var catCounts = [];

  (function buildIndex() {
    for (var i = 0; i < ITEMS.length; i++) {
      var it = ITEMS[i];
      byCode[it[0]] = it;
      index.push({ it: it, hay: (it[1] + ' ' + it[2]).toLowerCase() });
      catCounts[it[5]] = (catCounts[it[5]] || 0) + 1;
    }
  })();

  var view = document.getElementById('view');
  var qInput = document.getElementById('q');
  var clearBtn = document.getElementById('clear');
  var basket = document.getElementById('basket');
  var basketCount = document.getElementById('basketCount');
  var basketTotal = document.getElementById('basketTotal');
  var dialog = document.getElementById('order');
  var orderBody = document.getElementById('orderBody');
  var orderClose = document.getElementById('orderClose');

  var cart = loadCart();
  var shown = 80;
  var currentList = [];
  var searchTimer = null;

  /* ---------------------------------------------------------------- utils */

  function money(n) {
    var v = Math.round(n * 100) / 100;
    return '\u20B9' + v.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function byName(a, b) {
    return a[1].localeCompare(b[1]);
  }

  function loadCart() {
    var out = {};
    try {
      var raw = localStorage.getItem('ssmart-cart-v1');
      if (raw) {
        var parsed = JSON.parse(raw);
        for (var k in parsed) {
          if (Object.prototype.hasOwnProperty.call(parsed, k) && parsed[k] > 0) out[k] = parsed[k];
        }
      }
    } catch (e) {
      /* private mode, storage disabled */
    }
    return out;
  }

  function saveCart() {
    try {
      localStorage.setItem('ssmart-cart-v1', JSON.stringify(cart));
    } catch (e) {
      /* ignore */
    }
  }

  function cartCount() {
    var n = 0;
    for (var k in cart) n += cart[k];
    return n;
  }

  function cartTotal() {
    var t = 0;
    for (var k in cart) {
      var it = byCode[k];
      if (it) t += it[3] * cart[k];
    }
    return t;
  }

  /* --------------------------------------------------------------- router */

  function parseHash() {
    var h = location.hash || '';
    if (h.indexOf('#/c/') === 0) return { view: 'cat', slug: h.slice(4) };
    if (h.indexOf('#/q/') === 0) return { view: 'search', q: decodeURIComponent(h.slice(4)) };
    return { view: 'home' };
  }

  function render() {
    var r = parseHash();
    if (r.view === 'cat') renderCategory(r.slug);
    else if (r.view === 'search') renderSearch(r.q);
    else renderHome();
    window.scrollTo(0, 0);
    updateBasket();
  }

  /* ---------------------------------------------------------------- views */

  function renderHome() {
    currentList = [];
    var tiles = '';
    for (var i = 0; i < CATS.length; i++) {
      tiles +=
        '<a class="tile" href="#/c/' + CATS[i][0] + '">' +
        '<span class="tile__name">' + esc(CATS[i][1]) + '</span>' +
        '<span class="tile__count">' + (catCounts[i] || 0) + '</span>' +
        '</a>';
    }

    view.innerHTML =
      '<h1 class="cat-h1">What do you need?</h1>' +
      '<p class="lede">Every item we stock, at the price on our last stock list. Build a list and send it on WhatsApp. We confirm availability and the total before packing.</p>' +
      '<p class="notice"><strong>Prices can change.</strong> This list may be out of date, so the reply on WhatsApp is the final price.</p>' +
      '<p class="notice"><strong>Delivery is not free.</strong> The delivery fee is charged to the customer, and delivery happens after the order amount is paid. Pay it before we come.</p>' +
      '<div class="tiles">' + tiles + '</div>';
  }

  function renderCategory(slug) {
    var idx = -1;
    for (var i = 0; i < CATS.length; i++) {
      if (CATS[i][0] === slug) { idx = i; break; }
    }
    if (idx === -1) {
      renderMissing();
      return;
    }

    currentList = [];
    for (var j = 0; j < ITEMS.length; j++) {
      if (ITEMS[j][5] === idx) currentList.push(ITEMS[j]);
    }
    currentList.sort(byName);
    shown = 80;

    view.innerHTML =
      '<a class="crumb" href="#/">All categories</a>' +
      '<h1 class="cat-h1">' + esc(CATS[idx][1]) + '<small>' + currentList.length + '</small></h1>' +
      '<ul class="items" id="list"></ul>' +
      '<div id="moreWrap" class="more-wrap"></div>';

    paintList();
  }

  function renderSearch(q) {
    currentList = searchItems(q);
    shown = 80;
    var label = 'Matches for \u201C' + esc(q) + '\u201D';

    view.innerHTML =
      '<a class="crumb" href="#/">All categories</a>' +
      '<h1 class="cat-h1">' + currentList.length + ' item' + (currentList.length === 1 ? '' : 's') +
      '<small>' + label + '</small></h1>' +
      (currentList.length
        ? '<ul class="items" id="list"></ul><div id="moreWrap" class="more-wrap"></div>'
        : emptyHtml(q));

    if (currentList.length) paintList();
  }

  function renderMissing() {
    view.innerHTML =
      '<a class="crumb" href="#/">All categories</a>' +
      '<h1 class="cat-h1">That shelf is empty</h1>' +
      '<p class="lede">The category may have been renamed. <a href="#/">See all categories</a>.</p>';
  }

  function emptyHtml(q) {
    return (
      '<div class="empty">' +
      '<p class="empty__title">Nothing matched \u201C' + esc(q) + '\u201D.</p>' +
      '<p>We may still have it. Send the name on WhatsApp and we will check.</p>' +
      '<a class="btn btn--primary" href="' + waUrl('Do you have: ' + q + '?') + '" target="_blank" rel="noopener">Ask on WhatsApp</a>' +
      '</div>'
    );
  }

  /* ----------------------------------------------------------------- list */

  function paintList() {
    var list = document.getElementById('list');
    var wrap = document.getElementById('moreWrap');
    if (!list) return;

    var html = '';
    var end = Math.min(shown, currentList.length);
    for (var i = 0; i < end; i++) html += rowHtml(currentList[i]);
    list.innerHTML = html;

    if (currentList.length > shown) {
      var next = Math.min(80, currentList.length - shown);
      wrap.innerHTML =
        '<button class="btn btn--ghost more" id="more" type="button">Show ' + next + ' more</button>';
    } else {
      wrap.innerHTML = '';
    }
  }

  function rowHtml(it) {
    var code = it[0];
    var qty = cart[code] || 0;
    var mrp = it[4];

    return (
      '<li class="item" data-code="' + esc(code) + '">' +
      '<div class="item__main">' +
      '<p class="item__name">' + esc(it[1]) + '</p>' +
      (it[2] ? '<p class="item__meta">' + esc(it[2]) + '</p>' : '') +
      '</div>' +
      '<div class="item__price">' +
      '<span class="item__rate">' + money(it[3]) + '</span>' +
      (mrp ? '<s class="item__mrp">' + money(mrp) + '</s>' : '') +
      '</div>' +
      '<div class="item__act">' + actHtml(code, qty, 'add') + '</div>' +
      '</li>'
    );
  }

  function actHtml(code, qty, prefix) {
    if (!qty) {
      return (
        '<button class="add" type="button" data-' + prefix + '="' + esc(code) + '" aria-label="Add ' +
        esc((byCode[code] || [])[1] || '') + ' to the order">Add</button>'
      );
    }
    return (
      '<div class="stepper">' +
      '<button type="button" data-' + prefix + 'dec="' + esc(code) + '" aria-label="Remove one">\u2212</button>' +
      '<span aria-live="polite">' + qty + '</span>' +
      '<button type="button" data-' + prefix + 'inc="' + esc(code) + '" aria-label="Add one">+</button>' +
      '</div>'
    );
  }

  function syncRow(code) {
    var row = null;
    var rows = view.querySelectorAll('.item');
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].getAttribute('data-code') === code) { row = rows[i]; break; }
    }
    if (!row) return;
    var act = row.querySelector('.item__act');
    if (act) act.innerHTML = actHtml(code, cart[code] || 0, 'add');
  }

  /* ---------------------------------------------------------------- cart */

  function addOne(code) {
    if (!byCode[code]) return;
    cart[code] = (cart[code] || 0) + 1;
    saveCart();
    syncRow(code);
    updateBasket();
    if (dialog.open) refreshOrderLines();
  }

  function removeOne(code) {
    if (!cart[code]) return;
    cart[code] -= 1;
    if (cart[code] <= 0) delete cart[code];
    saveCart();
    syncRow(code);
    updateBasket();
    if (dialog.open) {
      if (cartCount() === 0) {
        dialog.close();
        return;
      }
      refreshOrderLines();
    }
  }

  function updateBasket() {
    var n = cartCount();
    basket.hidden = n === 0;
    document.body.classList.toggle('has-basket', n > 0);
    if (n) {
      basketCount.textContent = n + (n === 1 ? ' item' : ' items');
      basketTotal.textContent = money(cartTotal());
    }
  }

  /* --------------------------------------------------------------- order */

  function mode() {
    var el = document.querySelector('input[name="omode"]:checked');
    return el ? el.value : 'Pickup';
  }

  function openOrder() {
    if (cartCount() === 0) return;
    orderBody.innerHTML = orderHtml();
    dialog.showModal();
  }

  function orderHtml() {
    var lines = '';
    for (var code in cart) {
      var it = byCode[code];
      if (!it) continue;
      lines +=
        '<li class="oline" data-code="' + esc(code) + '">' +
        '<div class="oline__main">' +
        '<p class="oline__name">' + esc(it[1]) + '</p>' +
        (it[2] ? '<p class="oline__meta">' + esc(it[2]) + '</p>' : '') +
        '</div>' +
        '<div class="oline__qty">' + actHtml(code, cart[code], 'o') + '</div>' +
        '<div class="oline__sum">' + money(it[3] * cart[code]) + '</div>' +
        '</li>';
    }

    return (
      '<ul class="olines">' + lines + '</ul>' +
      '<p class="ototal"><span>Total</span><strong id="orderTotal">' + money(cartTotal()) + '</strong></p>' +
      '<p class="odefee" id="odeFee" hidden>Delivery fee: ' + money(DELIVERY_FEE) + ' (pay to the delivery person at delivery. Delivery happens after the order amount is paid.)</p>' +
      '<p class="onote">Prices come from our last stock list and can change. We confirm the total on WhatsApp before packing. Delivery happens after the order amount is paid.</p>' +
      '<div class="oform">' +
      '<label class="field"><span>Your name</span>' +
      '<input id="oname" type="text" autocomplete="name" required /></label>' +
      '<fieldset class="field field--choice"><legend>Pickup or delivery?</legend>' +
      '<label class="radio"><input type="radio" name="omode" value="Pickup" checked /> Pickup</label>' +
      '<label class="radio"><input type="radio" name="omode" value="Delivery" /> Delivery</label>' +
      '</fieldset>' +
      '<label class="field" id="addrField" hidden><span>Delivery address</span>' +
      '<textarea id="oaddr" rows="2" autocomplete="street-address"></textarea></label>' +
      '<label class="field"><span>Anything else? (optional)</span>' +
      '<textarea id="onote" rows="2"></textarea></label>' +
      '<p class="oerr" id="oerr" hidden></p>' +
      '<div class="oacts">' +
      '<button class="btn btn--primary" type="button" id="send">Send on WhatsApp</button>' +
      '<button class="btn btn--ghost" type="button" id="copy">Copy order</button>' +
      '</div>' +
      '<button class="olink" type="button" id="clearCart">Clear this order</button>' +
      '</div>'
    );
  }

  function refreshOrderLines() {
    var totals = document.getElementById('orderTotal');
    if (!totals) return;
    var fee = document.getElementById('odeFee');
    if (fee) fee.hidden = mode() !== 'Delivery';
    var lines = orderBody.querySelectorAll('.oline');
    for (var i = 0; i < lines.length; i++) {
      var code = lines[i].getAttribute('data-code');
      var qty = cart[code] || 0;
      lines[i].querySelector('.oline__qty').innerHTML = actHtml(code, qty, 'o');
      var it = byCode[code];
      lines[i].querySelector('.oline__sum').textContent = money(it[3] * qty);
    }
    totals.textContent = money(cartTotal());
  }

  function buildOrderText() {
    var name = (document.getElementById('oname') || {}).value || '';
    var mode = mode();
    var addr = (document.getElementById('oaddr') || {}).value || '';
    var note = (document.getElementById('onote') || {}).value || '';

    var lines = [];
    var total = 0;
    var count = 0;
    for (var code in cart) {
      var it = byCode[code];
      if (!it) continue;
      var qty = cart[code];
      var amount = it[3] * qty;
      total += amount;
      count += qty;
      lines.push(
        lines.length + 1 + '. ' + it[1] + (it[2] ? ' (' + it[2] + ')' : '') +
        ' \u2014 ' + qty + ' \u00D7 ' + money(it[3]) + ' = ' + money(amount)
      );
    }

    var text =
      '*SS MART order*\n\n' + lines.join('\n') +
      '\n\nTotal: ' + money(total) + ' (' + count + (count === 1 ? ' item' : ' items') + ')';
    if (mode === 'Delivery' && DELIVERY_FEE > 0) {
      text +=
        '\nDelivery fee: ' + money(DELIVERY_FEE) + '\n' +
        'Delivery happens after the order amount is paid. Pay the delivery fee to the delivery person when they come.';
    }
    text +=
      '\n\nName: ' + name + '\n' +
      'Pickup or delivery: ' + mode + '\n' +
      (mode === 'Delivery' && addr ? 'Address: ' + addr + '\n' : '') +
      (note ? 'Note: ' + note + '\n' : '');

    if (text.length > 3500) {
      var trimmed = lines.slice(0, 40);
      text =
        '*SS MART order*\n\n' + trimmed.join('\n') +
        '\n\u2026and ' + (lines.length - 40) + ' more items.' +
        '\n\nTotal: ' + money(total) + ' (' + count + ' items)' +
        (mode === 'Delivery' && DELIVERY_FEE > 0
          ? '\nDelivery fee: ' + money(DELIVERY_FEE) + '\nDelivery happens after the order amount is paid. Pay the delivery fee to the delivery person when they come.'
          : '') +
        '\n\nName: ' + name + '\nPickup or delivery: ' + mode + '\n' +
        (mode === 'Delivery' && addr ? 'Address: ' + addr + '\n' : '') +
        (note ? 'Note: ' + note + '\n' : '');
    }

    return text;
  }

  function waUrl(text) {
    return 'https://wa.me/' + SETTINGS.whatsapp + '?text=' + encodeURIComponent(text);
  }

  function showError(msg) {
    var el = document.getElementById('oerr');
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
  }

  function sendOrder() {
    var name = (document.getElementById('oname') || {}).value.trim();
    var mode = mode();
    var addr = (document.getElementById('oaddr') || {}).value.trim();

    if (!name) {
      showError('Add your name so the shop knows who is ordering.');
      document.getElementById('oname').focus();
      return;
    }
    if (mode === 'Delivery' && !addr) {
      showError('Add a delivery address, or switch to pickup.');
      document.getElementById('oaddr').focus();
      return;
    }

    window.open(waUrl(buildOrderText()), '_blank', 'noopener');
  }

  function copyOrder() {
    var text = buildOrderText();
    var done = function () {
      var btn = document.getElementById('copy');
      if (btn) btn.textContent = 'Copied';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { showError('Could not copy. Select the text and copy it manually.'); });
    } else {
      showError('Copy is not available in this browser. Send on WhatsApp instead.');
    }
  }

  /* -------------------------------------------------------------- search */

  function searchItems(q) {
    var tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!tokens.length) return [];

    var out = [];
    for (var i = 0; i < index.length; i++) {
      var hay = index[i].hay;
      var ok = true;
      for (var j = 0; j < tokens.length; j++) {
        if (hay.indexOf(tokens[j]) === -1) { ok = false; break; }
      }
      if (ok) out.push(index[i]);
    }

    out.sort(function (a, b) {
      return rank(a.it, tokens[0]) - rank(b.it, tokens[0]) || a.it[1].localeCompare(b.it[1]);
    });

    return out.map(function (x) { return x.it; });
  }

  function rank(it, token) {
    var n = it[1].toLowerCase();
    if (n.indexOf(token) === 0) return 0;
    var i = n.indexOf(token);
    if (i > 0 && /[\s\-\/&.,]/.test(n.charAt(i - 1))) return 1;
    return 2;
  }

  /* -------------------------------------------------------------- events */

  view.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;

    if (btn.id === 'more') {
      shown += 80;
      paintList();
      return;
    }

    var code = btn.getAttribute('data-add');
    if (code !== null) { addOne(code); return; }

    code = btn.getAttribute('data-inc');
    if (code !== null) { addOne(code); return; }

    code = btn.getAttribute('data-dec');
    if (code !== null) { removeOne(code); return; }
  });

  orderBody.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;

    var code = btn.getAttribute('data-oinc');
    if (code !== null) { addOne(code); return; }

    code = btn.getAttribute('data-odec');
    if (code !== null) { removeOne(code); return; }

    if (btn.id === 'send') { sendOrder(); return; }
    if (btn.id === 'copy') { copyOrder(); return; }
    if (btn.id === 'clearCart') {
      cart = {};
      saveCart();
      updateBasket();
      dialog.close();
      var rows = view.querySelectorAll('.item');
      for (var i = 0; i < rows.length; i++) {
        var act = rows[i].querySelector('.item__act');
        if (act) act.innerHTML = actHtml(rows[i].getAttribute('data-code'), 0, 'add');
      }
    }
  });

  orderBody.addEventListener('change', function (e) {
    if (e.target.name !== 'omode') return;
    var field = document.getElementById('addrField');
    if (field) field.hidden = e.target.value !== 'Delivery';
  });

  qInput.addEventListener('input', function () {
    var v = qInput.value.trim();
    clearBtn.hidden = !v;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      if (v) {
        history.replaceState(null, '', '#/q/' + encodeURIComponent(v));
        renderSearch(v);
      } else {
        history.replaceState(null, '', '#/');
        renderHome();
      }
      updateBasket();
    }, 140);
  });

  clearBtn.addEventListener('click', function () {
    qInput.value = '';
    clearBtn.hidden = true;
    history.replaceState(null, '', '#/');
    renderHome();
    qInput.focus();
  });

  document.getElementById('review').addEventListener('click', openOrder);
  orderClose.addEventListener('click', function () { dialog.close(); });

  dialog.addEventListener('click', function (e) {
    var rect = dialog.getBoundingClientRect();
    if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
      dialog.close();
    }
  });

  window.addEventListener('hashchange', function () {
    var r = parseHash();
    if (r.view === 'search') {
      qInput.value = r.q;
      clearBtn.hidden = false;
    } else {
      qInput.value = '';
      clearBtn.hidden = true;
    }
    render();
  });

  /* ----------------------------------------------------------------- boot */

  (function boot() {
    var r = parseHash();
    if (r.view === 'search') {
      qInput.value = r.q;
      clearBtn.hidden = false;
    }
    render();
  })();
})();

    </script>
  </body>
</html>
